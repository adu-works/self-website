<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680"><rect x="70" y="85" width="850" height="510" rx="12" fill="#869f96"/><rect x="62" y="70" width="850" height="510" rx="12" fill="#f1f1eb"/><path d="M62 112h850" stroke="#d0d7cd"/><g fill="#a4b4a5"><circle cx="86" cy="92" r="4"/><circle cx="100" cy="92" r="4"/><circle cx="114" cy="92" r="4"/></g><text x="130" y="197" fill="#6e8378" font-family="sans-serif" font-size="16">你好，我是黄凌波。</text><g fill="#233d33" font-family="sans-serif" font-size="50"><text x="130" y="273">认真生活，</text><text x="130" y="342">把想法变成作品。</text></g><text x="130" y="404" fill="#748579" font-family="sans-serif" font-size="17">文字、书籍与动手的实践，在这里慢慢积累。</text><path d="M130 463h140" stroke="#395648"/><text x="130" y="451" fill="#395648" font-family="sans-serif" font-size="15">多认识我一点 ↗</text><rect x="658" y="184" width="214" height="306" rx="3" fill="#245445"/><text x="685" y="228" fill="#bfd2c4" font-family="monospace" font-size="11">A BOOK IN PROGRESS</text><g fill="#f0eddd" font-family="sans-serif" font-size="29"><text x="685" y="320">从想法到</text><text x="685" y="365">自己的小站</text></g><path d="M685 423h156" stroke="#89a89a"/><text x="685" y="454" fill="#bdd1c4" font-family="sans-serif" font-size="12">公开阅读 · 示例书稿</text></svg>
